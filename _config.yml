# ドローン友の会 — サイト設定（GitHub Pages / Jekyll）
# この設定を変えたときは、GitHubに反映後1〜2分で公開サイトに反映されます。

title: ドローン友の会
description: 初心者のためのドローン情報。買ってから飛ばすまでに必要なことを、順番どおりに。
lang: ja_JP
timezone: Asia/Tokyo

url: https://drone-tomonokai.jp
baseurl: ""

# LINE公式アカウントの友だち追加リンク（コラムページのCTAで使用）
line_url: https://lin.ee/XqapxDi

# 楽天ROOM：自分のROOMページのURL（例：https://room.rakuten.co.jp/room_xxxxxxxxxx/items）
# トップと各コラムの最後のSNS欄に「楽天ROOM（PR）」として出ます。空のままだと表示されません（2026-10-19 に「おすすめアイテム」ページを廃止）
rakuten_room_url: "https://room.rakuten.co.jp/room_584cfed81d/items"

# 楽天アフィリエイトID（楽天アフィリエイトの管理画面で確認できるもの）。記事内の商品カード（_data/rakuten_items.yml）のリンクに使われます
# 空のままだと、商品カードは表示されません
rakuten_affiliate_id: "1ebce8ca.1fe2f85d.1ebce8cb.79468e10"

# Googleアナリティクスの測定ID（例："G-XXXXXXXXXX"）
# 空のままだとアナリティクスは読み込まれません。入れるとプライバシーポリシーの記載どおり計測が始まります
google_analytics_id: "G-VMJ4M4E86T"

# Googleアドセンスのサイト運営者ID（例："ca-pub-0000000000000000"）
# 入れると、全ページに確認用のメタタグ、コラムの記事ページにだけ広告のコードが入ります（_includes/adsense.html）。
# 空にすると両方とも出なくなります。ads.txt（サイト直下）のIDも合わせて直すこと
adsense_client: "ca-pub-4174847427845119"

# コラム記事のURL： /columns/2026/10/chiriin-map-airspace/ の形になります
permalink: /columns/:year/:month/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: columns/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: column
      author: ドローン友の会

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - CLAUDE.md
  - log.md
  - .gitignore
