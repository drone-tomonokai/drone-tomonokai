<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.st{background:#fff;border:4px solid #000;border-radius:22px;padding:20px 10px 18px;height:380px;box-sizing:border-box;text-align:center}
.no{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#FF4F00;color:#fff;font-weight:900;font-size:26px}
.ic{height:60px;display:grid;place-items:center;margin:10px 0 8px}
.ic svg{width:56px;height:56px}
.h{font-weight:900;font-size:25px;line-height:1.35}
.d{margin-top:12px;font-weight:700;font-size:17px;line-height:1.6;color:#333}
.goal{position:absolute;left:56px;right:56px;bottom:28px;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:900;font-size:28px}
.goal span{background:#000;color:#fff;border-radius:999px;padding:10px 30px}
</style></head><body>
<div class="c">
  <div class="ttl">ドローン本体のほかに、最初にそろえる5つ</div>
  <div class="steps">
    <div class="st"><span class="no">1</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-30 12 12)"><path d="M12 12C9 7.6 3.6 7 1.6 9.6 2.6 13.4 8 14.6 12 12Z" fill="#000"/><path d="M12 12c3 4.4 8.4 5 10.4 2.4C21.4 10.6 16 9.4 12 12Z" stroke="#FF4F00" fill="#FF4F00"/></g><circle cx="12" cy="12" r="2.4" fill="#fff" stroke="#000"/></svg></div>
      <div class="h">予備<br>プロペラ</div>
      <div class="d">小さな接触でも<br>欠ける消耗品。<br>自分の機種に<br>合うものを</div></div>
    <div class="st"><span class="no">2</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3"/><path d="M6.5 10v4M9.5 10v4" stroke="#FF4F00"/></svg></div>
      <div class="h">予備<br>バッテリー</div>
      <div class="d">1本で飛べる<br>時間は短い。<br>2〜3本あると<br>練習が続く</div></div>
    <div class="st"><span class="no">3</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M10 3v4M13 3v4M16 4.5V7" stroke="#FF4F00"/></svg></div>
      <div class="h">microSD<br>カード</div>
      <div class="d">機種によっては<br>ないと保存<br>できない。<br>推奨のカードを</div></div>
    <div class="st"><span class="no">4</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3" stroke="#FF4F00"/><path d="M3 16h7"/></svg></div>
      <div class="h">風速計</div>
      <div class="d">風の強さは<br>感覚では<br>分かりにくい。<br>5m/s以上は<br>飛ばさない</div></div>
    <div class="st"><span class="no">5</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M12.5 7.5l-2 3.5h3l-2 3.5" stroke="#FF4F00"/></svg></div>
      <div class="h">操縦用の<br>スマホと充電</div>
      <div class="d">途中の電池切れは<br>危ない。<br>対応端末か確認し、<br>モバイル<br>バッテリーも</div></div>
  </div>
  <div class="goal"><span>買う前に</span>本体に付いてくるもの（同梱品）を確認</div>
</div></body></html>
