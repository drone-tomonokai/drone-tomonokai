<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.st{position:relative;background:#fff;border:4px solid #000;border-radius:22px;padding:22px 18px 20px;height:380px;box-sizing:border-box;text-align:center}
.st.flow+.st.flow::before{content:"";position:absolute;left:-38px;top:50%;width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:22px solid #000;transform:translateY(-50%)}
.st.alt{border-style:dashed}
.when{display:inline-block;background:#FF4F00;color:#fff;font-weight:900;font-size:24px;border-radius:999px;padding:6px 22px}
.st.alt .when{background:#000}
.ic{height:60px;display:grid;place-items:center;margin:12px 0 6px}
.ic svg{width:56px;height:56px}
.h{font-weight:900;font-size:30px;line-height:1.35}
.f{font-weight:700;font-size:20px;color:#333}
.d{margin-top:12px;font-weight:700;font-size:20px;line-height:1.6;color:#333}
.goal{position:absolute;left:56px;right:56px;bottom:28px;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:900;font-size:28px}
.goal span{background:#000;color:#fff;border-radius:999px;padding:10px 30px}
</style></head><body>
<div class="c">
  <div class="ttl">飛行日誌の3つの記録と、書くタイミング</div>
  <div class="steps">
    <div class="st flow"><span class="when">飛ばす前</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 9l1.8 1.8L14 7" stroke="#FF4F00"/><path d="M8.5 15.5l1.8 1.8L14 13.5" stroke="#FF4F00"/></svg></div>
      <div class="h">日常点検記録</div>
      <div class="f">（様式2）</div>
      <div class="d">プロペラ・バッテリー<br>などの点検の結果を<br>項目ごとに書く</div></div>
    <div class="st flow"><span class="when">飛ばしたあと</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2" stroke="#FF4F00"/></svg></div>
      <div class="h">飛行記録</div>
      <div class="f">（様式1）</div>
      <div class="d">日時・場所・飛行時間<br>を書く。飛行後点検の<br>結果は様式2の特記事項へ</div></div>
    <div class="st alt"><span class="when">整備したとき</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16l4 4 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5 2.5-2.5Z"/><path d="M6.5 17.5l1.5-1.5" stroke="#FF4F00"/></svg></div>
      <div class="h">点検整備記録</div>
      <div class="f">（様式3）</div>
      <div class="d">点検整備・修理・<br>部品交換の内容と<br>理由を書く</div></div>
  </div>
  <div class="goal"><span>3つとも「機体ごと」に用意する</span>特定飛行では義務、それ以外も推奨</div>
</div></body></html>
