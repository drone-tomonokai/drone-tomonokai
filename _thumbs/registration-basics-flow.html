<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.st{position:relative;background:#fff;border:4px solid #000;border-radius:22px;padding:22px 14px 20px;height:380px;box-sizing:border-box;text-align:center}
.st+.st::before{content:"";position:absolute;left:-34px;top:50%;width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:22px solid #000;transform:translateY(-50%)}
.no{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#FF4F00;color:#fff;font-weight:900;font-size:28px}
.ic{height:60px;display:grid;place-items:center;margin:10px 0 8px}
.ic svg{width:56px;height:56px}
.h{font-weight:900;font-size:26px;line-height:1.4}
.d{margin-top:10px;font-weight:700;font-size:18px;line-height:1.6;color:#333}
.goal{position:absolute;left:56px;right:56px;bottom:28px;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:900;font-size:30px}
.goal span{background:#000;color:#fff;border-radius:999px;padding:10px 30px}
</style></head><body>
<div class="c">
  <div class="ttl">100g以上の機体を、飛ばせるようになるまで</div>
  <div class="steps">
    <div class="st"><span class="no">1</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14l-2-11H7L5 20Z"/><circle cx="12" cy="6" r="2.2"/><path d="M10.5 14.5l2.5-2.5" stroke="#FF4F00"/></svg></div>
      <div class="h">重さを<br>確かめる</div>
      <div class="d">本体＋バッテリーで<br>100g以上なら<br>登録が必要</div></div>
    <div class="st"><span class="no">2</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 10.5l3 3 6-6" stroke="#FF4F00"/></svg></div>
      <div class="h">DIPS 2.0 で<br>登録を申請</div>
      <div class="d">登録記号が<br>発行される<br>（有効期間は3年）</div></div>
    <div class="st"><span class="no">3</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12l5 5-5 5H3V7Z"/><path d="M6.5 12h6" stroke="#FF4F00"/></svg></div>
      <div class="h">登録記号を<br>機体に表示</div>
      <div class="d">外から見やすい所に。<br>25kg未満の機体は<br>文字の高さ3mm以上</div></div>
    <div class="st"><span class="no">4</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="15" r="2" fill="#000" stroke="none"/><path d="M8.5 11.5a5 5 0 0 1 7 0" stroke="#FF4F00"/><path d="M5.5 8.5a9 9 0 0 1 13 0"/></svg></div>
      <div class="h">リモートID<br>機能を搭載</div>
      <div class="d">内蔵の機体と、<br>外付けの機器が<br>必要な機体がある</div></div>
  </div>
  <div class="goal"><span>ここまでで「登録済みの機体」に</span>飛ばす場所・方法のルールは別に確認</div>
</div></body></html>
