<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.st{position:relative;background:#fff;border:4px solid #000;border-radius:22px;padding:22px 14px 20px;height:360px;box-sizing:border-box;text-align:center}
.st+.st::before{content:"";position:absolute;left:-34px;top:50%;width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:22px solid #000;transform:translateY(-50%)}
.no{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#FF4F00;color:#fff;font-weight:900;font-size:28px}
.ic{height:60px;display:grid;place-items:center;margin:10px 0 8px}
.ic svg{width:56px;height:56px}
.h{font-weight:900;font-size:28px;line-height:1.4}
.d{margin-top:10px;font-weight:700;font-size:19px;line-height:1.6;color:#333}
.goal{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:900;font-size:26px}
.goal span{background:#000;color:#fff;border-radius:999px;padding:10px 26px}
</style></head><body>
<div class="c">
  <div class="ttl">事故のときにやることの順番</div>
  <div class="steps">
    <div class="st"><span class="no">1</span>
      <div class="ic"><svg viewBox="0 0 32 32"><circle cx="9" cy="9" r="4.2" fill="none" stroke="#FF4F00" stroke-width="2.4"/><circle cx="23" cy="9" r="4.2" fill="none" stroke="#FF4F00" stroke-width="2.4"/><circle cx="9" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><circle cx="23" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><rect x="12.5" y="12.5" width="7" height="7" rx="2" fill="#000"/></svg></div>
      <div class="h">飛行を<br>やめる</div>
      <div class="d">近くの安全な<br>場所に、速やかに<br>着陸させる</div></div>
    <div class="st"><span class="no">2</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M12 10.5v6M9 13.5h6" stroke="#FF4F00"/></svg></div>
      <div class="h">けが人を<br>助ける</div>
      <div class="d">救急車を呼び、<br>できる手当てを。<br>むやみに動かさない</div></div>
    <div class="st"><span class="no">3</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1 2.5 2 3 0-3 0-5.5 1-8.5Z" stroke="#FF4F00"/><path d="M4 21h16"/></svg></div>
      <div class="h">危険を<br>広げない</div>
      <div class="d">火が出たら消防へ<br>連絡・消火。<br>警察へ事故の概要を</div></div>
    <div class="st"><span class="no">4</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6" stroke="#FF4F00"/></svg></div>
      <div class="h">国に<br>報告する</div>
      <div class="d">報告の対象なら<br>DIPS 2.0から<br>速やかに</div></div>
  </div>
  <div class="goal"><span>落ちた機体に注意</span>回っているプロペラに手を出さない・バッテリーの膨らみを確認</div>
</div></body></html>
