<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.st{position:relative;background:#fff;border:4px solid #000;border-radius:22px;padding:24px 18px 20px;height:420px;box-sizing:border-box;text-align:center}
.st+.st::before{content:"";position:absolute;left:-34px;top:50%;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:22px solid #000;transform:translateY(-50%)}
.lb{display:inline-block;background:#FF4F00;color:#fff;font-weight:900;font-size:22px;border-radius:999px;padding:6px 20px}
.st.k .lb{background:#000}
.ic{height:72px;display:grid;place-items:center;margin:14px 0 8px}
.ic svg{width:64px;height:64px}
.h{font-weight:900;font-size:28px;line-height:1.4}
.d{margin-top:12px;font-weight:700;font-size:19px;line-height:1.65;color:#333}
</style></head><body>
<div class="c">
  <div class="ttl">災害の現場で、個人が飛ばすのはやめましょう</div>
  <div class="steps">
    <div class="st"><span class="lb">知っておく</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8" stroke="#FF4F00"/></svg></div>
      <div class="h">緊急用務空域</div>
      <div class="d">警察・消防などの活動のため<br>国土交通省が指定する。<br>許可を受けていても、<br>原則として飛ばせない</div></div>
    <div class="st k"><span class="lb">確かめる</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke="#FF4F00"/></svg></div>
      <div class="h">出ているか</div>
      <div class="d">国土交通省の<br>ホームページと X で<br>確かめられる</div></div>
    <div class="st k"><span class="lb">役に立ちたいなら</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V8l8-4 8 4v11"/><path d="M8 19v-6h8v6" stroke="#FF4F00"/></svg></div>
      <div class="h">まず学ぶ</div>
      <div class="d">基本の操作と飛行ルールを<br>身につけ、資格の講習などで<br>正しい関わり方を学ぶ</div></div>
  </div>
</div></body></html>
