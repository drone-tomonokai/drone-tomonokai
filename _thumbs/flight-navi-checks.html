<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.steps{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.st{background:#fff;border:4px solid #000;border-radius:22px;padding:20px 10px 18px;height:380px;box-sizing:border-box;text-align:center}
.no{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#FF4F00;color:#fff;font-weight:900;font-size:26px}
.ic{height:60px;display:grid;place-items:center;margin:10px 0 8px}
.ic svg{width:56px;height:56px}
.h{font-weight:900;font-size:23px;line-height:1.4}
.d{margin-top:12px;font-weight:700;font-size:17px;line-height:1.6;color:#333}
.d b{display:block;margin-top:8px;color:#000}
.goal{position:absolute;left:56px;right:56px;bottom:28px;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:900;font-size:26px}
.goal span{background:#000;color:#fff;border-radius:999px;padding:10px 28px}
</style></head><body>
<div class="c">
  <div class="ttl">飛ばす前に確かめる5つ</div>
  <div class="steps">
    <div class="st"><span class="no">1</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 15.5s-3-3.2-3-5.3a3 3 0 0 1 6 0c0 2.1-3 5.3-3 5.3Z" stroke="#FF4F00"/></svg></div>
      <div class="h">地図の<br>色の区域</div>
      <div class="d">人口集中地区・<br>空港の周辺・<br>重要施設の周り<b>フライトナビ</b></div></div>
    <div class="st"><span class="no">2</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14" stroke="#FF4F00"/></svg></div>
      <div class="h">境目・<br>工業専用地域</div>
      <div class="d">境目の近くは<br>見比べる<b>地理院地図／<br>自治体・都市計画<br>GISビューア</b></div></div>
    <div class="st"><span class="no">3</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9.5v4.5" stroke="#FF4F00"/><circle cx="12" cy="16.6" r=".6" fill="#FF4F00" stroke="#FF4F00"/></svg></div>
      <div class="h">緊急用務<br>空域</div>
      <div class="d">飛ばす直前に<br>出ていないか<b>国土交通省の<br>ホームページ・X</b></div></div>
    <div class="st"><span class="no">4</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/><path d="M16 4v4M14 6h4" stroke="#FF4F00"/></svg></div>
      <div class="h">飛ばし方</div>
      <div class="d">夜間・30m未満・<br>150m以上など<b>日の出・日の入りは<br>アプリの画面の下</b></div></div>
    <div class="st"><span class="no">5</span>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5" stroke="#FF4F00"/></svg></div>
      <div class="h">場所の<br>管理者のルール</div>
      <div class="d">公園・河川敷・<br>私有地など<b>公園・自治体・<br>土地の管理者</b></div></div>
  </div>
  <div class="goal"><span>許可・承認が必要なら</span>DIPS2.0 から申請</div>
</div></body></html>
