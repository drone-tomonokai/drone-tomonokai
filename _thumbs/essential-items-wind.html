<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.box{position:absolute;top:164px;height:420px;background:#fff;border:4px solid #000;border-radius:22px;box-sizing:border-box}
.l{left:56px;width:520px}
.r{left:616px;width:528px;padding:30px 36px}
.sky{position:absolute;inset:0}
.lab{position:absolute;font-weight:900;font-size:24px;line-height:1.4}
.lab small{display:block;font-weight:700;font-size:18px;color:#333}
.r h3{margin:0 0 18px;font-weight:900;font-size:26px}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:2px solid #000}
.row:last-child{border-bottom:2px solid #000}
.tagx{flex:none;width:150px;text-align:center;border-radius:999px;padding:8px 0;font-weight:900;font-size:22px}
.ng{background:#FF4F00;color:#fff}
.mid{background:#000;color:#fff}
.row p{margin:0;font-weight:700;font-size:21px;line-height:1.5}
.note{position:absolute;left:56px;right:56px;bottom:30px;text-align:center;font-weight:700;font-size:20px;color:#333}
</style></head><body>
<div class="c">
  <div class="ttl">風速計で測れるのは、手元の風</div>
  <div class="box l">
    <svg class="sky" viewBox="0 0 512 412" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 上空の強い風 -->
      <g stroke="#FF4F00" stroke-width="7">
        <path d="M40 70h170"/><path d="M190 52l24 18-24 18"/>
        <path d="M40 118h210"/><path d="M230 100l24 18-24 18"/>
      </g>
      <!-- ドローン（上空） -->
      <g transform="translate(340 72)" stroke="#000" stroke-width="5">
        <path d="M-52-18h36M16-18h36"/>
        <path d="M-34-18v14M34-18v14M-34-4h68"/>
        <rect x="-18" y="-6" width="36" height="22" rx="6" fill="#000"/>
        <path d="M-12 16l-8 10M12 16l8 10"/>
      </g>
      <!-- 地上の弱い風 -->
      <g stroke="#000" stroke-width="5">
        <path d="M40 300h80"/><path d="M106 288l16 12-16 12"/>
      </g>
      <!-- 人と風速計 -->
      <g stroke="#000" stroke-width="5">
        <circle cx="200" cy="268" r="16"/>
        <path d="M200 284v62M200 346l-20 36M200 346l20 36M200 304l34-18"/>
        <path d="M234 286v-20"/><circle cx="234" cy="258" r="9" stroke="#FF4F00"/>
      </g>
      <path d="M0 384h512" stroke="#000" stroke-width="5"/>
    </svg>
    <div class="lab" style="left:300px;top:110px">上空<small>地上より風が<br>強いことがよくある</small></div>
    <div class="lab" style="left:280px;top:262px">手元の高さ<small>風速計で測れるのは<br>この高さの風</small></div>
  </div>
  <div class="box r">
    <h3>手元の風速で判断する</h3>
    <div class="row"><span class="tagx ng">5m/s以上</span><p>飛ばさない<br>（国の標準マニュアル）</p></div>
    <div class="row"><span class="tagx mid">ぎりぎり</span><p>上空はもっと強いかも。<br>その日はやめておく</p></div>
    <div class="row"><span class="tagx mid">風速計</span><p>手のひらサイズの<br>電池式で十分</p></div>
  </div>
</div></body></html>
