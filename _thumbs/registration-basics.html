<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FF4F00;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.deco{position:absolute;inset:0}
.ic{position:absolute;width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ic svg{width:56px;height:56px}
.body{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.label{display:inline-block;background:#000;color:#fff;font-weight:700;font-size:24px;letter-spacing:.06em;padding:8px 22px;border-radius:999px;margin-bottom:24px}
h1{margin:0;font-weight:900;font-size:76px;line-height:1.3;letter-spacing:.02em}
.sub{margin-top:22px;font-weight:700;font-size:28px;letter-spacing:.04em}
.brand{position:absolute;left:44px;bottom:36px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:26px}
</style></head><body>
<div class="c">
  <svg class="deco" viewBox="0 0 1200 675" fill="none" stroke="#fff" stroke-linecap="round">
    <!-- はかりの目盛り（左上） -->
    <g stroke-opacity=".45" stroke-width="3">
      <path d="M-20 70H300"/>
      <path d="M20 70V40M60 70V52M100 70V40M140 70V52M180 70V40M220 70V52M260 70V40"/>
    </g>
    <!-- 電波の弧（右下） -->
    <g stroke-opacity=".5" stroke-width="3">
      <circle cx="1120" cy="610" r="90"/>
      <circle cx="1120" cy="610" r="160" stroke-dasharray="4 14"/>
      <circle cx="1120" cy="610" r="235" stroke-dasharray="4 14" stroke-opacity=".7"/>
    </g>
    <!-- 境界線（右上） -->
    <path d="M900 30H1220" stroke-width="4" stroke-dasharray="14 12" stroke-opacity=".6"/>
    <path d="M172 540C300 610 450 620 560 596" stroke-width="4" stroke-dasharray="2 14" stroke-opacity=".9"/>
  </svg>

  <!-- アイコン：ドローン（サイトのロゴと同じ形）・はかり・登録記号のラベル・電波（リモートID） -->
  <div class="ic" style="left:64px;top:452px">
    <svg viewBox="0 0 32 32"><circle cx="9" cy="9" r="4.2" fill="none" stroke="#FF4F00" stroke-width="2.4"/><circle cx="23" cy="9" r="4.2" fill="none" stroke="#FF4F00" stroke-width="2.4"/><circle cx="9" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><circle cx="23" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><rect x="12.5" y="12.5" width="7" height="7" rx="2" fill="#000"/></svg>
  </div>
  <div class="ic" style="left:1010px;top:70px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14l-2-11H7L5 20Z"/><circle cx="12" cy="6" r="2.2"/><path d="M10.5 14.5l2.5-2.5" stroke="#FF4F00"/></svg>
  </div>
  <div class="ic" style="left:1076px;top:486px;width:88px;height:88px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="2" fill="#000" stroke="none"/><path d="M8.5 10.5a5 5 0 0 1 7 0" stroke="#FF4F00"/><path d="M5.5 7.5a9 9 0 0 1 13 0"/></svg>
  </div>
  <div class="ic" style="left:150px;top:110px;width:88px;height:88px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12l5 5-5 5H3V7Z"/><path d="M6.5 12h6" stroke="#FF4F00"/></svg>
  </div>

  <div class="body">
    <span class="label">コラム ／ 制度・ルール</span>
    <h1>買う前に知っておきたい<br>「100g」の境界線</h1>
    <p class="sub">重さの数え方・登録記号・リモートID</p>
  </div>

  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32"><circle cx="9" cy="9" r="4.2" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="23" cy="9" r="4.2" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="9" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><circle cx="23" cy="23" r="4.2" fill="none" stroke="#000" stroke-width="2.4"/><rect x="12.5" y="12.5" width="7" height="7" rx="2" fill="#000"/></svg>
    ドローン友の会
  </div>
</div>
</body></html>
