<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.main{position:absolute;left:56px;right:56px;top:150px;height:136px;background:#fff;border:4px solid #000;border-radius:22px;box-sizing:border-box;display:flex;align-items:center;gap:28px;padding:0 32px}
.tag{flex:none;background:#FF4F00;color:#fff;font-weight:900;font-size:26px;border-radius:999px;padding:8px 24px}
.main .h{font-weight:900;font-size:34px;line-height:1.35}
.main .d{font-weight:700;font-size:20px;color:#333;margin-top:4px}
.sub{position:absolute;left:56px;right:56px;top:310px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{background:#fff;border:4px dashed #000;border-radius:22px;box-sizing:border-box;padding:18px 24px;height:250px}
.box .tag{display:inline-block;background:#000;font-size:21px;padding:6px 18px}
.box .h{font-weight:900;font-size:25px;line-height:1.4;margin-top:12px}
.box .d{font-weight:700;font-size:19px;line-height:1.6;color:#333;margin-top:6px}
.foot{position:absolute;left:56px;right:56px;bottom:22px;text-align:center;font-weight:900;font-size:24px}
.foot span{background:#000;color:#fff;border-radius:999px;padding:8px 24px;margin-right:12px}
</style></head><body>
<div class="c">
  <div class="ttl">国への報告のしかた</div>
  <div class="main">
    <span class="tag">原則</span>
    <div><div class="h">DIPS 2.0 の「事故等報告機能」から、速やかに</div>
    <div class="d">日数の決まりはなく「速やかに」。場所はできるだけくわしく、地図なども添付する</div></div>
  </div>
  <div class="sub">
    <div class="box"><span class="tag">DIPS 2.0 が使えないとき</span>
      <div class="h">国の様式（Excel）で、メールなどで送る</div>
      <div class="d">許可・承認を受けた飛行 → それを出した官署<br>許可・承認なしの飛行 → 飛ばした場所の官署<br>メールで送ったら、電話でも連絡</div></div>
    <div class="box"><span class="tag">夜間など執務時間外</span>
      <div class="h">飛ばした場所を受け持つ<br>空港事務所に連絡</div>
      <div class="d">東京空港事務所・関西空港事務所<br>（どちらも24時間対応）</div></div>
  </div>
  <div class="foot"><span>迷ったら</span>無人航空機ヘルプデスク 03-5539-0225（平日9〜17時）</div>
</div></body></html>
