<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@600&display=block">
<style>
html,body{margin:0}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#FFF3EC;font-family:"Zen Kaku Gothic New",sans-serif;color:#000}
.ttl{position:absolute;left:56px;top:44px;font-weight:900;font-size:44px;letter-spacing:.02em}
.ttl::before{content:"";display:block;width:56px;height:6px;background:#FF4F00;margin-bottom:18px}
.cards{position:absolute;left:56px;right:56px;top:164px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cd{background:#fff;border:4px solid #000;border-radius:22px;height:466px;box-sizing:border-box;padding:24px 32px}
.top{display:flex;align-items:center;gap:14px}
.no{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#FF4F00;color:#fff;font-weight:900;font-size:28px}
.date{font-weight:900;font-size:22px;background:#000;color:#fff;border-radius:999px;padding:6px 18px}
.h{margin-top:14px;font-weight:900;font-size:29px;line-height:1.4}
.big{margin-top:14px;font-weight:900;font-size:30px;line-height:1.4}
.big b{color:#FF4F00}
.num{font-family:"Outfit",sans-serif;font-weight:600;font-size:64px;letter-spacing:-.02em;color:#FF4F00;line-height:1}
.num s{color:#000;text-decoration-thickness:4px;font-size:44px}
.num i{font-style:normal;color:#000;font-size:40px;margin:0 10px}
.d{margin-top:14px;padding-top:12px;border-top:2px solid #000;font-weight:700;font-size:18.5px;line-height:1.65;color:#333}
</style></head><body>
<div class="c">
  <div class="ttl">2026年7月に変わった2つのルール</div>
  <div class="cards">
    <div class="cd">
      <div class="top"><span class="no">1</span><span class="date">7月1日から</span></div>
      <div class="h">人口集中地区の中の<br>「工業専用地域」</div>
      <div class="big">人口集中地区としての<br>許可が<b>いらなくなった</b></div>
      <div class="d">空港の周辺・夜間・人や物から30m未満などの<br>許可・承認は、これまでどおり必要。<br>工業専用地域かの最終確認は、自治体か<br>「全国都市計画GISビューア」で</div>
    </div>
    <div class="cd">
      <div class="top"><span class="no">2</span><span class="date">7月14日施行</span></div>
      <div class="h">重要施設の周りの<br>飛ばせない範囲</div>
      <div class="num" style="margin-top:14px"><s>300m</s><i>→</i>1,000m</div>
      <div class="d">おおむね300mから、おおむね1,000mに。<br>周りの範囲（イエローゾーン）で<br>飛ばした場合にも、罰則ができた。<br>古い解説記事の「300m」に注意</div>
    </div>
  </div>
</div></body></html>
